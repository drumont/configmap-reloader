---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps.drumont
  resources:
  - configmapreloaders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.drumont
  resources:
  - configmapreloaders/finalizers
  verbs:
  - update
- apiGroups:
  - apps.drumont
  resources:
  - configmapreloaders/status
  verbs:
  - get
  - patch
  - update
