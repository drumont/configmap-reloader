# This rule is not used by the project configmap-reloader itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.drumont.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: configmap-reloader
    app.kubernetes.io/managed-by: kustomize
  name: configmapreloader-editor-role
rules:
- apiGroups:
  - apps.drumont
  resources:
  - configmapreloaders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.drumont
  resources:
  - configmapreloaders/status
  verbs:
  - get
